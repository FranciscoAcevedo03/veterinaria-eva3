{% extends 'base.html' %}

{% block content %}
<div class="card border-danger shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Confirmar Eliminación</h4>
    </div>
    <div class="card-body">
        <p>¿Estás seguro de que deseas eliminar permanentemente al paciente <strong>{{ object.nombre }}</strong> ({{ object.especie.nombre }})?</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'paciente_list' %}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
